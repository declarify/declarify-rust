name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and (re-)publish, e.g. v0.1.1"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - name: Build release binaries
        run: cargo build --release --workspace

      - name: Determine host target triple
        id: target
        shell: bash
        run: |
          echo "triple=$(rustc -vV | sed -n 's/^host: //p')" >> "$GITHUB_OUTPUT"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          triple="${{ steps.target.outputs.triple }}"
          dir="declarify-${triple}"
          mkdir -p "$dir"
          cp target/release/declarify target/release/notes target/release/notes-server "$dir/"
          cp README.md LICENSE "$dir/"
          tar czf "declarify-${triple}.tar.gz" "$dir"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $triple = "${{ steps.target.outputs.triple }}"
          $dir = "declarify-$triple"
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item target/release/declarify.exe,target/release/notes.exe,target/release/notes-server.exe,README.md,LICENSE -Destination $dir
          Compress-Archive -Path $dir -DestinationPath "declarify-$triple.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: declarify-${{ steps.target.outputs.triple }}
          path: |
            declarify-*.tar.gz
            declarify-*.zip
          if-no-files-found: error

  release:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "$tag" --generate-notes
          fi
