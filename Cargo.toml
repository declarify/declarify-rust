[workspace]
resolver = "2"
members = [
    "crates/declarify",
    "crates/declarify-core",
    "crates/declarify-macros",
    "crates/declarify-schema",
    "crates/declarify-codegen",
    "crates/declarify-cli",
    "crates/declarify-runtime",
    "examples/notes",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
declarify = { path = "crates/declarify" }
declarify-core = { path = "crates/declarify-core" }
declarify-macros = { path = "crates/declarify-macros" }
declarify-schema = { path = "crates/declarify-schema" }
declarify-codegen = { path = "crates/declarify-codegen" }
declarify-runtime = { path = "crates/declarify-runtime" }
serde = { version = "1", features = ["derive"] }
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
cargo_metadata = "0.18"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
rusqdoltlite = { version = "0.40", default-features = false, features = ["bundled", "chrono"] }
serde_json = "1"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
